name: Deploy (Cloud Run)

# SKELETON — no real deploy runs until GCP is wired. To enable:
#   1. Add repository secrets: GCP_PROJECT, GCP_SA_KEY, GCP_REGION
#   2. Set repository variable ENABLE_DEPLOY = "true"
# Until then the job is skipped, keeping `main` green. See README.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SERVICE_NAME: leanviser-arena-backend

jobs:
  deploy:
    name: Build & deploy to Cloud Run
    runs-on: ubuntu-latest
    # Guard: only runs once GCP is configured (secrets + this variable).
    if: ${{ vars.ENABLE_DEPLOY == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Build & push image (Cloud Build)
        run: |
          gcloud builds submit backend \
            --tag "gcr.io/${{ secrets.GCP_PROJECT }}/${SERVICE_NAME}:${GITHUB_SHA}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --image "gcr.io/${{ secrets.GCP_PROJECT }}/${SERVICE_NAME}:${GITHUB_SHA}" \
            --region "${{ secrets.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated
