[project]
name = "leanviser-arena-backend"
version = "0.1.0"
description = "LeanViser ARENA backend — gamified lean manufacturing simulation (v0.1)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "httpx>=0.27",
]

# Virtual project: uv manages the environment but does not build/install `app`
# as a package. Code is imported via `pythonpath` (tests) / WORKDIR (runtime).
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
